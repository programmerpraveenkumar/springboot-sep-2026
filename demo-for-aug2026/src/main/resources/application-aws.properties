spring.application.name=demo-for-aug2026
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/aug2026?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#spring.datasource.url=jdbc:mysql://localhost:3306/aug2026?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#spring.datasource.username=root
#spring.datasource.password=roottoor
spring.datasource.username=appuser
spring.datasource.password=AppPassword@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
JWT_SECURITY_KEY=china_key

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        /*
        css can be applied using
        tagname
        id
        class
        */
        /*
             css will be  applied to tag 
        
        */
        h1{
            color: red;
        }
        h2{
            color: blue;
            background-color: brown;
        }
        /* 
            class name
                define the name
                can be added to any element
                style can be applied using .(dot)
         */
        .my_h3{
            color: rgb(222, 222, 230);
            background-color: brown;
        }

        /*
            id
                define the name
                can be add to only one element
                style can be applied using #(hash)
        */
        #my_div_id{
            color: rgb(242, 0, 129);
            background-color: rgb(255, 225, 1);
        }
        
    </style>
</head>
<body>
    <h1>hi this is html css</h1>
    <h1>hi this is another h1</h1>
    <h2>hi good evening</h2>
    <h3 class="my_h3">this is h3 element</h3>
    <h3>this is h3 element1</h3>
    <input class="my_h3" type="text">
    <div id="my_div_id">this is div</div>
</body>
</html>

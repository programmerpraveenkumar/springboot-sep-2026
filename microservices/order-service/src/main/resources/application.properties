spring.application.name=order-service
spring.datasource.url=jdbc:mysql://localhost:3306/aug2026?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=roottoor
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8081
spring.cloud.openfeign.circuitbreaker.enabled=true

spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin

#call is 5
resilience4j.circuitbreaker.instances.USER-SERVICE.sliding-window-size=5

#starts count failure call
resilience4j.circuitbreaker.instances.USER-SERVICE.minimum-number-of-calls=5

#try to call after some failure
resilience4j.circuitbreaker.instances.USER-SERVICE.failure-rate-threshold=50

#open for 10secs
resilience4j.circuitbreaker.instances.USER-SERVICE.wait-duration-in-open-state=10s


#after 10secs allow for 2 calls
resilience4j.circuitbreaker.instances.USER-SERVICE.permitted-number-of-calls-in-half-open-state=2

# Actuator
management.endpoints.web.exposure.include=health,metrics

services:

  # Eureka Discovery Server
  ms-server:
    build:
      context: ./ms-server
    container_name: ms-server
    expose:
      - "8761" 
    ports:
      - "8761:8761"
    networks:
      - micro-network
    restart: unless-stopped

  # API Gateway
  apigateway:
    build:
      context: ./apigateway
    container_name: apigateway
    ports:
      - "8083:8083"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-server:8761/eureka/
    depends_on:
      - ms-server
    networks:
      - micro-network
    restart: unless-stopped

  # User Service
  user-service:
    build:
      context: ./user-service
    container_name: user-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-server:8761/eureka/
      DB_URL: jdbc:mysql://host.docker.internal:3306/aug2026?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    expose:
      - "8085" 
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ms-server
      - kafka
    networks:
      - micro-network
    restart: unless-stopped

  # Order Service
  order-service:
    build:
      context: ./order-service
    container_name: order-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-server:8761/eureka/
      DB_URL: jdbc:mysql://host.docker.internal:3306/aug2026?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8084"   
    depends_on:
      - ms-server
      - kafka
    networks:
      - micro-network
    restart: unless-stopped

  # Kafka
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - micro-network

    restart: unless-stopped

networks:
  micro-network:
    driver: bridge

volumes:
  kafka_data:
